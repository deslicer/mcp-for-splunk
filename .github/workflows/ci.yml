name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      MCP_DISABLE_PLUGINS: "true"
      UV_PYTHON: "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install Python 3.11 via uv
        run: uv python install 3.11

      - name: Check dependency lockfile
        run: uv lock --check

      - name: Sync dependencies (dev)
        run: uv sync --locked --dev

      - name: Lint (ruff)
        run: uv run --locked ruff check src/

      - name: Type check (mypy)
        run: uv run --locked mypy src/

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run --locked pytest -q --maxfail=1

      - name: Build and smoke-test the installed wheel
        run: |
          uv build --all-packages --wheel
          uv run --locked python scripts/check_wheel.py dist/mcp_server_for_splunk-*.whl dist/mcp_itsi_server-*.whl


