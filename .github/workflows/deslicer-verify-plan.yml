name: Deslicer Verify Plan
on:
  workflow_dispatch:
    inputs:
      plan_id:
        description: Deslicer plan id
        required: true
      environment:
        description: YAML stem / GitHub Environment (default = sole stem)
        required: false
permissions:
  id-token: write
  contents: read
jobs:
  resolve-environment:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.environments.outputs.target }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - id: environments
        name: List environments
        env:
          PIN: ${{ inputs.environment }}
          MODE: one
        run: |
          chmod +x .github/scripts/discover-deslicer-environments.sh
          .github/scripts/discover-deslicer-environments.sh
  verify:
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.target }}
    env:
      DESLICER_API_URL: ${{ vars.DESLICER_API_URL }}
      DESLICER_ENVIRONMENT: ${{ needs.resolve-environment.outputs.target }}
    steps:
      - name: Preflight Deslicer configuration
        run: |
          set -euo pipefail
          if [[ -z "${DESLICER_API_URL}" ]]; then
            echo "::error::Set repository variable DESLICER_API_URL to your deslicer-ai portal base URL"
            exit 1
          fi
          if [[ -z "${DESLICER_ENVIRONMENT}" ]]; then
            echo "::error::Could not resolve environment stem from .deslicer/environments/"
            exit 1
          fi
          if ! curl -fsS --connect-timeout 10 --max-time 25 "${DESLICER_API_URL%/}/api/health" >/dev/null; then
            echo "::error::Cannot reach deslicer-ai at DESLICER_API_URL (GET /api/health failed)"
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - id: cli
        uses: deslicer/change-action@d78dd26a58f47d5f54c93f316eb3d6db02d2e75e
        with:
          github-token: ${{ github.token }}
      - id: verify
        name: Verify plan
        env:
          PLAN_ID: ${{ inputs.plan_id }}
        run: |
          set -euo pipefail
          CLI="${{ steps.cli.outputs.cli-path }}"
          LOG="$(mktemp)"
          trap 'rm -f "${LOG}"' EXIT
          set +e
          "${CLI}" change verify \
            --plan-id "${PLAN_ID}" \
            --environment "${DESLICER_ENVIRONMENT}" \
            >"${LOG}" 2>&1
          CODE=$?
          set -e
          cat "${LOG}"
          VERIFY_ERROR="$(sed -n 's/^verification failed: //p' "${LOG}" | tail -n 1)"
          if [[ -z "${VERIFY_ERROR}" ]]; then
            VERIFY_ERROR="$(grep -Ev '^[[:space:]]*$' "${LOG}" | tail -n 1 || true)"
          fi
          VERIFY_ERROR="$(printf '%s' "${VERIFY_ERROR}" | tr -d '\r' | cut -c1-200)"
          {
            echo "exit_code=${CODE}"
            echo "verify_error=${VERIFY_ERROR}"
          } >> "${GITHUB_OUTPUT}"
          exit "${CODE}"
      - name: Verify summary
        if: always() && steps.verify.outcome != 'skipped'
        env:
          PLAN_ID: ${{ inputs.plan_id }}
          ENVIRONMENT: ${{ env.DESLICER_ENVIRONMENT }}
          OUTCOME: ${{ steps.verify.outcome }}
          EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
          VERIFY_ERROR: ${{ steps.verify.outputs.verify_error }}
          PLAN_STATUS: ${{ steps.verify.outputs.plan_status }}
          PLAN_SUMMARY: ${{ steps.verify.outputs.plan_summary }}
          DIFF_TOTAL: ${{ steps.verify.outputs.diff_total }}
          DIFF_ADDITIONS: ${{ steps.verify.outputs.diff_additions }}
          DIFF_MODIFICATIONS: ${{ steps.verify.outputs.diff_modifications }}
          DIFF_DELETIONS: ${{ steps.verify.outputs.diff_deletions }}
          DESLICER_API_URL: ${{ vars.DESLICER_API_URL }}
        run: |
          chmod +x .github/scripts/append-verify-summary.sh
          .github/scripts/append-verify-summary.sh
